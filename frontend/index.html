<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quote Favorites</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>✨ Quote of the Moment</h1>

        <section class="quote-card">

            <p id="quote">Loading quote...</p>

            <p id="author"></p>

            <p id="topic"></p>

            <p id="source"></p>

            <div class="buttons">

                <button id="newQuoteBtn">
                    🔄 New Quote
                </button>

                <button id="favoriteBtn">
                    ❤️ Favorite
                </button>

                <button id="copyBtn">
                    📋 Copy
                </button>

            </div>

        </section>


        <section class="favorites-section">

            <h2>❤️ My Favorite Quotes</h2>

            <div id="favoritesList">
                <p>No favorites yet.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
